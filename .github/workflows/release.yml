name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  pack:
    name: Build release candidate without write credentials
    if: github.repository == 'yannmenec/inspectrum'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH tags are supported" >&2
            exit 1
          fi
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate tarball contents
        run: npm pack --dry-run --json

      - name: Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          mapfile -t tarballs < <(find . -maxdepth 1 -type f -name 'inspectrum-*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "npm pack did not leave exactly one tarball" >&2
            exit 1
          fi
          echo "tarball=${tarballs[0]#./}" >> "$GITHUB_OUTPUT"

      - name: Build MCPB bundle
        run: npm run build:mcpb

      - name: Validate, inspect, and smoke MCPB bundle
        run: npm run verify:mcpb

      - name: Hash the exact candidates
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: sha256sum "$TARBALL" dist-mcpb/inspectrum-*.mcpb > release-candidate.sha256

      - name: Upload candidates for the write-scoped job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            dist-mcpb/inspectrum-*.mcpb
            release-candidate.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  release:
    name: Create draft release from validated MCPB
    needs: pack
    if: github.repository == 'yannmenec/inspectrum'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: candidate

      - name: Verify candidate hashes
        working-directory: candidate
        run: sha256sum -c release-candidate.sha256

      - name: Upload MCPB to a draft release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: candidate/dist-mcpb/inspectrum-*.mcpb
          fail_on_unmatched_files: true
          draft: true
