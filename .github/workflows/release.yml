name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  pack:
    name: Pack and upload tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate tarball contents
        run: npm pack --dry-run --json

      - name: Pack
        id: pack
        run: |
          npm pack
          echo "tarball=$(ls inspectrum-*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.tarball }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      - name: Build MCPB bundle
        run: npm run build:mcpb

      - name: Create stable alias asset (inspectrum.mcpb)
        run: cp dist-mcpb/inspectrum-*.mcpb dist-mcpb/inspectrum.mcpb

      - name: Upload .mcpb to Release (draft)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            dist-mcpb/inspectrum-*.mcpb
            dist-mcpb/inspectrum.mcpb
          fail_on_unmatched_files: true
          draft: true

      # Intentional: this workflow does NOT run `npm publish`. The owner runs
      # `npm publish --access public` manually after reviewing the tarball.
