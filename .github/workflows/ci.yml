name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    name: "Node ${{ matrix.node }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/

      - name: Build
        run: npm run build

      - name: Test (coverage gate)
        run: npm run test:coverage

      - name: Test (e2e MCP stdio)
        run: npm run test:e2e
