name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    name: "Node ${{ matrix.node }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        if: matrix.node == '20'
        run: npm audit --omit=dev

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/

      - name: Build
        run: npm run build

      - name: Test (coverage gate)
        run: npm run test:coverage

      - name: Test (e2e MCP stdio)
        run: npm run test:e2e

      - name: Build MCPB bundle (first stage)
        if: matrix.node == '20'
        run: |
          npm run build:mcpb
          cp dist-mcpb/inspectrum-*.mcpb "$RUNNER_TEMP/inspectrum-first.mcpb"

      - name: Rebuild MCPB bundle deterministically
        if: matrix.node == '20'
        run: |
          npm run build:mcpb
          cmp -s "$RUNNER_TEMP/inspectrum-first.mcpb" dist-mcpb/inspectrum-*.mcpb

      - name: Validate, inspect, and smoke MCPB bundle
        if: matrix.node == '20'
        run: npm run verify:mcpb
